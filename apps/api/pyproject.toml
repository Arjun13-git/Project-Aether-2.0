[project]
name = "aether"
version = "0.1.0"
description = "Aether 2.0 — evidence-first Earth-observation analysis (API, worker, geo engine)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "geoalchemy2>=0.20.0",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyogrio==0.13.0",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.0",
    "rasterio>=1.5.2",
    "rio-tiler>=9.4.12",
    "scikit-image>=0.26",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "db: requires the PostGIS test database (AETHER_TEST_DATABASE_URL)",
  "live: requires network access to Earth Search (excluded by default)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = false
