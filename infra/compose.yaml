# Aether 2.0 — local development services (LOCAL-DEV.md).
# PostGIS is the only container in the MVP. Bound to loopback only.
name: aether
services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${AETHER_DB_PASSWORD:?set AETHER_DB_PASSWORD in infra/.env (see infra/.env.example)}
      POSTGRES_DB: aether
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
