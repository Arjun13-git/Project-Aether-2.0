# Aether 2.0 CI (Phase 0/1). Not yet executed on a runner; mirrors docs/LOCAL-DEV.md.
name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env: {POSTGRES_USER: aether, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: aether_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aether" --health-interval 2s --health-retries 30
    defaults: {run: {working-directory: apps/api}}
    env:
      AETHER_TEST_DATABASE_URL: postgresql+psycopg://aether:ci-only@127.0.0.1:5432/aether_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests migrations ../../scripts
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv run python ../../scripts/licence_report.py --fail-on-denied
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 26, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm build
